<script>
    let input = prompt("Introduce un numero: ");
    let output;
    if (!isNaN(parseFloat(input))){
        if(input < 5){
            output = "Suspenso";
        } else if (input < 7){
            output = "Aprobado";
        } else if (input < 9){
            output = "Notable";
        } else{
            output = "Sobresaliente";
        }
        console.log(output);
    }else {
        console.log(input + " no es un numero");
    }
</script>
