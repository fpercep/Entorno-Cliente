<script>
    let input = (prompt("Introduce un numero: ").toLowerCase());
    let recomendacion;
    if (input === "carne") {
        recomendacion = "vino";
    } else if (input === "pescado") {
        recomendacion = "vino blanco";
    } else {
        recomendacion = "agua";
    }
    console.log("Con su comida se le recomienda " + recomendacion);
</script>
