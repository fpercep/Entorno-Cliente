<script>
    let num1 = parseInt(prompt("Introduzca el primer numero"));
    let num2 = parseInt(prompt("Introduzca el segundo numero"));

    if (num1 > num2) {
        alert(`El número mayor es ${num1}`);
    } else if (num2 > num1) {
        alert(`El número mayor es ${num2}`);
    } else {
        alert(`Son el mismo número: ${num1}`);
    }
</script>
