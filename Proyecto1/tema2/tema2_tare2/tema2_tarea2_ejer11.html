<script>
    let numeros = [2, 6, 7, 8];

    let find6 = numeros.find(num => num === 6);
    let find10 = numeros.find(num => num === 10);
    console.log("find(6):", find6);
    console.log("find(10):", find10);

    let indexOf6 = numeros.indexOf(6);
    let indexOf10 = numeros.indexOf(10);
    console.log("indexOf(6):", indexOf6);
    console.log("indexOf(10):", indexOf10);
</script>
