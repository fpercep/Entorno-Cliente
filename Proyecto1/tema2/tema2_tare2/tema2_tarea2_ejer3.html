<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
</html>

<script>
    let a = 5;
    let b = 10;
    let c = 15;

    console.log(`a = ${a}, b = ${b}, c = ${c}`);

    a += b;
    console.log(`a += b: a = ${a}`);

    b -= c;
    console.log(`b -= c: b = ${b}`);

    c *= a;
    console.log(`c *= a: c = ${c}`);

    a /= 2;
    console.log(`a /= 2: a = ${a}`);

    b **= 2;
    console.log(`b **= 2: b = ${b}`);

    c %= 3;
    console.log(`c %= 3: c = ${c}`);
</script>
