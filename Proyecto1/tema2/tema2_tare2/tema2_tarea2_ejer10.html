<script>
    let arr1 = [1, 2, 3];
    let arr2 = [4, 5, 6];
    console.log("arr1 =", arr1);
    console.log("arr2 =", arr2);

    let arr3 = arr1.concat(arr2);
    console.log("arr3 =", arr3);

    arr3.push(7, 8, 9);
    console.log("arr3 =", arr3);

    arr3.splice(0, 1);
    console.log("arr3 =", arr3);

    arr3.splice(2, 3);
    console.log("arr3 =", arr3);

</script>
