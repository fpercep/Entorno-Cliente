<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script>
        const numeros = [1, 2, 3, 2, 4, 1, 5];

        function valoresUnicosSet(arr) {
            return [...new Set(arr)];
        }

        function valoresUnicosManual(arr) {
            return arr.filter((valor, indice, self) => {
                return self.indexOf(valor) === indice;
            });
        }

        console.log("Con Set:", valoresUnicosSet(numeros));
        console.log("Manual:", valoresUnicosManual(numeros));
    </script>
</body>
</html>
