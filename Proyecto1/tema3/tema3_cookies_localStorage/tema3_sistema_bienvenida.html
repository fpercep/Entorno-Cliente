<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script>
         function establecerCookie(nombre, valor, dias) {
            let valorEncript = encodeURIComponent(valor);
            document.cookie = nombre + "=" + valorEncript + ";expires=" + calcularDia(dias)  + ";path=/";
         }
         function calcularDia(dias) {
             let hoy = new Date();
             let nuevoDia = new Date(hoy.getTime() + Number(dias) * (24 * 60 * 60 * 1000));
             return nuevoDia.toUTCString();
         }

         function obtenerCookie(nombre) {
             let cookies = document.cookie.split(';');
             return cookies.find(cookie => cookie.trim().startsWith(nombre + "="))
         }
         function comprobarCookie(nombre){
             if (!obtenerCookie(nombre)){
                 solicitarCookie(nombre);
             }else {
                 alert("Bienvenido de nuevo, " + obtenerValorCookie(nombre));
             }
         }

         function obtenerValorCookie(nombre){
             let cookie = obtenerCookie(nombre);
             if (!cookie) {
                 alert("La cookie " + nombre + " no existe");
             }else {
                 console.log(cookie.split("=")[1])
                 return decodeURIComponent(cookie.split("=")[1]);
             }
         }

         function solicitarCookie(nombre){
             let valor = prompt("Introduce el valor de cookie " + nombre + ":");
             if (valor === null || valor.trim() === "") {
                 alert("La cookie no se puedo crear de una manera correcta");
                 return;
             }
             establecerCookie(nombre, valor, 30);
             alert("Cookie guardada.")
         }

         comprobarCookie("usuario");
</script>
</body>
</html>
