<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Búsqueda de empleados</title>
</head>
<body>
<h2>Empleados</h2>
<input type="text" id="filtro" placeholder="Filtrar por departamento">
<ul id="listaEmpleados"></ul>
<script>
    let empleados = []
    const filtro = document.getElementById("filtro");
    let listaEmpleados = document.getElementById("listaEmpleados");

    const fetchConRetardo = async (url, opciones = {}) => {
        await new Promise(resolve => setTimeout(resolve, 2000));
        return fetch(url, opciones);
    };

    async function cargarEmpleados(){
        let res = await fetchConRetardo("http://localhost:3000/empleados", {
            method: "GET",
            headers: {
                'Content-Type': 'application/json'
            },
        })
        if (!res.ok) {
            if (!res.ok) {throw new Error(res.statusText);}
        }
        return await res.json()
    }

    function mostrarEmpleados(empleados){
        listaEmpleados.innerHTML = "";
        for (const empleado of empleados) {
            let element = document.createElement("li");
            element.textContent = `${empleado.id} - ${empleado.nombre} - ${empleado.puesto} - ${empleado.departamente} - ${empleado.salario}`;
            listaEmpleados.append(element);
        }
    }

    async function iniciar(){
        try {
            empleados = await cargarEmpleados();
            mostrarEmpleados(empleados);
        } catch (error) {
            console.error("Fallo en la carga:", error);
        }
    }

    iniciar();
</script>
</body>
</html>
