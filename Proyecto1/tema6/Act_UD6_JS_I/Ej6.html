<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alta cliente y proyecto</title>
</head>
<body>
<h2>Alta de cliente</h2>
<input type="text" id="nombre" placeholder="Nombre del cliente"><br>
<input type="email" id="email" placeholder="Email"><br><br>
<button id="btnCrear">Crear cliente y proyecto</button>
<p id="resultado"></p>
<script>

    document.getElementById("btnCrear").addEventListener('click', function(){
        let nombre = document.getElementById("nombre").value;
        let email = document.getElementById("email").value;

        let cliente = {
            nombre: nombre,
            email: email,
        }

        crearUsuario(cliente);
    })


    const fetchConRetardo = async (url, opciones = {}) => {
        await new Promise(resolve => setTimeout(resolve, 2000));
        return fetch(url, opciones);
    };

    async function crearUsuario(cliente) {
        const response = await fetchConRetardo("http://localhost:3000/clientes", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(cliente)
        });
        if (!response.ok) {throw new Error(response.statusText)};
        let datos = await response.json();
        await crearProyectoInicial(datos.nombre, datos.id)
        return datos;
    }

    async function crearProyectoInicial(nombre, clienteId) {
        const nuevoProyecto = {nombre: nombre, clienteId: clienteId};

        const response = await fetchConRetardo("http://localhost:3000/proyectos", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(nuevoProyecto)
        })
        if (!response.ok) {throw new Error(response.statusText)};
        return response.json();
    }
</script>
</body>
</html>
