<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alta cliente</title>
</head>
<body>
<h2>Alta de cliente</h2>
<input type="text" id="nombre" placeholder="Nombre"><br>
<input type="email" id="email" placeholder="Email"><br>
<input type="text" id="empresa" placeholder="Empresa"><br><br>
<button id="btnAlta">Dar de alta</button>
<script>
    let btnAlta = document.getElementById("btnAlta");

    const fetchConRetardo = async (url, opciones = {}) => {
        await new Promise(resolve => setTimeout(resolve, 2000));
        return fetch(url, opciones);
    };

    async function registrarCliente(cliente) {
        const response = await fetchConRetardo("http://localhost:3000/clientes", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(cliente)
        });
        if (!response.ok) {throw new Error(response.statusText);}
        return await response.json();
    }

    btnAlta.addEventListener("click", async function(){
            let nombre = document.getElementById("nombre").value;
            let email = document.getElementById("email").value;
            let empresa = document.getElementById("empresa").value;

            const cliente = {nombre: nombre, email: email, empresa: empresa};
            try {
                let nuevoCliente = await registrarCliente(cliente)
                console.log(nuevoCliente)
            } catch (error) {
                console.log(error);
            }
    })
</script>
</body>
</html>
