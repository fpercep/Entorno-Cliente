<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<h1>Gestión de Alumnos - Axios</h1>
<div id="mensaje-estado"></div>

<hr>

<section>
    <h2>Añadir Nuevo Alumno</h2>
    <form id="formulario-alumno">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="curso" placeholder="Curso" required>
        <button type="submit" id="btn-guardar">Guardar Alumno</button>
    </form>
</section>

<hr>

<section>
    <h2>Lista de Alumnos</h2>
    <ul id="lista-alumnos"></ul>
</section>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
