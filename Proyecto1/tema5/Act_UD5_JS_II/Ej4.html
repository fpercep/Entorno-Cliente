<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 4</title>
</head>
<body>
	<form id="registro">
		<input type="text" name="nombre" placeholder="Nombre">
		<input type="email" name="email" placeholder="Email">
		<input type="password" name="password" placeholder="Contraseña">
	</form>
    <script>
        let registro = document.getElementById("registro");

        registro.addEventListener('input', (event) => {
            let field = event.target;
            let name = field.name;

            // Validamos según el atributo name detectado por event.target
            if (name === "nombre") {
                field.style.outline = field.value.length < 3 ? "2px solid red" : "";
            } else if (name === "password") {
                field.style.outline = field.value.length < 6 ? "2px solid red" : "";
            }
        });
    </script>
</body>
</html>
