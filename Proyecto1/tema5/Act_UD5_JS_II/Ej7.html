<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 7</title>
</head>
<body>
<div id="notificaciones">
  <div class="notificacion">
    <p>Nuevo mensaje 1</p>
    <button>Cerrar</button>
  </div>
  <div class="notificacion">
    <p>Nuevo mensaje 2</p>
    <button>Cerrar</button>
  </div>
</div>
<script>
    let contenedor = document.getElementById("notificaciones");

    contenedor.addEventListener('click', (event) => {
        let target = event.target;
        // closest busca el ancestro más cercano que cumpla el selector, identificando la notificación padre
        let card = target.closest('.notificacion');

        if (target.tagName === 'BUTTON') {
            card.remove();
        } else if (card) {
            console.log(card.querySelector('p').textContent);
        }
    });
</script>
</body>
</html>
