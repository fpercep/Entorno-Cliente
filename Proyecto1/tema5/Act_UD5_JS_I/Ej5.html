<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 5 - Carrusel</title>
<style>
  #carrusel { width: 300px; height: 200px; background-color: lightgray; display:flex; justify-content:center; align-items:center; margin-bottom:10px; }
  button { padding: 5px 10px; }
</style>
</head>
<body>
<h2>Carrusel de imágenes</h2>
<div id="carrusel">img1.png</div>
<button id="detener">Detener carrusel</button>
<script>
    const imagenes = ["img1.png", "img2.png", "img3.png"];
    const divImagen = document.getElementById("carrusel");
    const detener = document.getElementById("detener");
    let contador = 0
    let intervalo = setInterval(() => {
        contador++;
        if (contador >= imagenes.length) {
            contador = 0;
        }
        divImagen.textContent = imagenes[contador];
    }, 3000);

    detener.addEventListener("click", (event) => {
        clearInterval(intervalo);
        console.log(event.type);
    })
</script>
</body>
</html>
