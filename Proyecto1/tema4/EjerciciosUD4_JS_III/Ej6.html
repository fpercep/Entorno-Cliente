<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 6 - Screen y Navigator</title>
</head>
<body>

<h2>Información del dispositivo</h2>

<ul id="info-dispositivo"></ul>

<script>
    const lista = document.getElementById('info-dispositivo');
     const informacion = {
         "Ancho": screen.width,
         "Alto": screen.height,
         "Navegador": navigator.userAgent,
         "Idioma": navigator.language,
     }

    for (const [clave, valor] of Object.entries(informacion)) {
        let li = document.createElement("li");
        li.textContent = clave + ": " + valor;
        lista.appendChild(li);
    }
    if (screen.width < 200) {
        console.log("Pantalla Pequeña !!!!!!");
    }
</script>
</body>
</html>
