<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 2 - Nodos y elementos</title>
</head>
<body>

<div id="bloque">
  
  Texto suelto
  <!-- Comentario -->
  <p>Primer párrafo</p>
  <p>Segundo párrafo</p>

</div>

<script>
    let bloque = document.getElementById('bloque');
    console.log("Numero de Nodos: " + bloque.childNodes.length);
    console.log("Numero de Elementos: " + bloque.children.length);
    //Existen 7 nodos y 2 elementos, ya que los nodos tambien son los comentarios,
    //los saltos de linea y texto suelto. Mientras que los elementos son dos las etiquetas que
    //el navegador reconoce

    let hijosBloque = bloque.childNodes;
    for (const hijo of hijosBloque) {
         console.log("Elemento ",hijo,":", hijo.nodeType)

        if (hijo.nodeType === 1) {
            hijo.style.border = "red solid 2px";
        }
    }

</script>

</body>
</html>
