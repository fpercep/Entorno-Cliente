<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 4 - Location</title>
</head>
<body>

<h2>Información de la URL</h2>
<ul id="info-url"></ul>

<script>
    const loc = window.location;

    const parametros = {
        "url": loc.hostname,
        "protocolo": loc.protocol,
        "host": loc.host,
        "hostname": loc.hostname,
        "puerto": loc.port,
        "pathname": loc.pathname,
        "queryString": loc.search || "Sin parametros",
        "hash": loc.hash || "Sin hash",

    }

    const lista = document.getElementById('info-url');
    for (const [clave, valor] of Object.entries(parametros)) {
        let li = document.createElement("li");
        li.textContent = clave +": "+ valor;
        lista.appendChild(li);
    }

    if (loc.search !== "") {
        alert("La URL contiene párametros");
    }

    if (loc.hash !== "") {
        lista.style.backgroundColor = "red";
    }

</script>

</body>
</html>
