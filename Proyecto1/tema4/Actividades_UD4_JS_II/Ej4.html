<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
</head>
<body>
<div id="menu">
  <button>Opción 1</button>
  <button>Opción 2</button>
  <button>Opción 3</button>
</div>
<p id="info">Haz clic en un botón</p>
</body>
<script>
    const menu = document.getElementById('menu');

    menu.addEventListener('click', (event) => {

        const destinoClick = event.target;
        const contenidoRaiz = event.currentTarget;
        const info = document.getElementById('info');

        if (destinoClick.tagName === 'BUTTON') {
            destinoClick.style.color = "green";
            contenidoRaiz.style.border = "1px solid black";

            info.textContent = destinoClick.textContent;
        }
    })
</script>
</html>
