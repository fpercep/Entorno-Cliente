<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
</head>
<body>
<div id="contenido">
  <p>Primer párrafo</p>
  <p>Segundo párrafo</p>
</div>
<button id="btnCambiarTexto">Cambiar texto</button>
<button id="btnAnadirElemento">Añadir párrafo</button>
<button id="btnReemplazar">Reemplazar primer párrafo</button>
<button id="btnEliminar">Eliminar último párrafo</button>
</body>
<script>
    const contenido = document.getElementById('contenido');
    const btnCambiarTexto = document.getElementById("btnCambiarTexto");
    const btnAnadirElemento = document.getElementById("btnAnadirElemento");
    const btnReemplazar = document.getElementById("btnReemplazar");
    const btnEliminar = document.getElementById("btnEliminar");

    btnCambiarTexto.addEventListener("click", () => {
        const parrafos = contenido.getElementsByTagName('p');
        if (parrafos.length >= 2) {
            parrafos[1].innerHTML = '<strong> ' +  parrafos[1].textContent + ' </strong>';
        }

        if (parrafos.length >= 1) {
            parrafos[0].innerText =  parrafos[0].textContent + "(modificado)";
        }
    })

    btnAnadirElemento.addEventListener('click', () => {
        const nuevoParrafo = document.createElement('p');
        nuevoParrafo.textContent = "Párrafo añadido";
        contenido.appendChild(nuevoParrafo);
    })

    btnReemplazar.addEventListener("click", () => {
        if (contenido.firstElementChild) {
            const nuevoParrafo = document.createElement('p');
            nuevoParrafo.textContent = "Primer párrafo remplazado"
            contenido.replaceChild(nuevoParrafo, contenido.firstElementChild);
        }
    })

    btnEliminar.addEventListener("click", () => {
        if (contenido.lastElementChild) {
            contenido.removeChild(contenido.lastElementChild);
        }
    })

    if (contenido.firstElementChild) {
        const parrafoClonado = contenido.firstElementChild.cloneNode(true);
        contenido.appendChild(parrafoClonado);
    }
</script>
</html>
