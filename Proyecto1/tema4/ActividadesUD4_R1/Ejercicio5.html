<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de tareas</title>
    <style>
        .tarea {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h2>Listado de tareas</h2>

    <div id="contenedorTareas">
        <div class="tarea" data-estado="pendiente">
            <p class="descripcion">Preparar documentación del proyecto</p>
        </div>

        <div class="tarea" data-estado="pendiente">
            <p class="descripcion">Revisar incidencias del sistema</p>
        </div>
    </div>

    <button id="btnModificar">Modificar primera tarea</button>
    <button id="btnBorrar">Eliminar primera tarea</button>

    <script>
        const tareas = document.getElementsByClassName('tarea');
        const modificar = document.getElementById('btnModificar');
        const elminar = document.getElementById('btnBorrar');

        modificar.addEventListener('click', () => {
            const tarea = tareas[0]
            let descripciones = tarea.getElementsByClassName('descripcion');
            let parrafo = descripciones[0];
            parrafo.firstChild.nodeValue += " (Terminado)";
            tarea.setAttribute('data-estado', 'completado');
        })

        elminar.addEventListener('click', () => {
            const tarea = tareas[0]
            tarea.parentNode.removeChild(tarea)
        })
    </script>

</body>
</html>
