<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Intranet - Avisos</title>
    <style>
        .aviso {
            color: darkred;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Avisos internos</h2>

    <ul id="listaAvisos">
        <li class="aviso">Reunión general el lunes</li>
        <li class="aviso">Actualización de servidores el viernes</li>
    </ul>

    <button id="btnAgregar">Añadir aviso</button>
    <button id="btnEliminar">Eliminar último aviso</button>

    <script>
        const lista = document.getElementById('listaAvisos');
        const agregar = document.getElementById('btnAgregar');
        const eliminar = document.getElementById('btnEliminar');

        agregar.addEventListener('click', () => {
            const nuevoAviso = document.createElement('li');
            const textoAviso = document.createTextNode('Nuevo aviso importante');
            nuevoAviso.appendChild(textoAviso);
            nuevoAviso.setAttribute('class', 'aviso');
            lista.appendChild(nuevoAviso);
        });
        eliminar.addEventListener('click', () => {
            const ultimoEvento = lista.lastChild;
            lista.removeChild(ultimoEvento);
        });
    </script>

</body>
</html>
